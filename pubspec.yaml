name: vani
description: VANI - Voice AI Native Interface for India
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── On-Device AI (Gemma 4 E2B LiteRT-LM) ───────
  flutter_gemma: ^0.14.0

  # ── Audio Recording ─────────────────────────────
  record: ^5.1.0

  # ── Speech To Text ──────────────────────────────
  speech_to_text: ^7.0.0

  # ── Text To Speech ──────────────────────────────
  flutter_tts: ^4.0.2

  # ── App Integration (open apps) ─────────────────
  url_launcher: ^6.3.0

  # ── Permissions ─────────────────────────────────
  permission_handler: ^11.3.1

  # ── State Management ────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Local Storage ───────────────────────────────
  shared_preferences: ^2.3.2

  # ── Utilities ───────────────────────────────────
  path_provider: ^2.1.4
  path: ^1.9.0
  logger: ^2.4.0
  cupertino_icons: ^1.0.8
  string_similarity: ^2.0.0

dependency_overrides:
  # record_linux 0.7.2 is incompatible with record_platform_interface 1.5.0;
  # force the updated implementation that matches the interface.
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
