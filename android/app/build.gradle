plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.vani.vani"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.vani.vani"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    // Allow large model files
    aaptOptions {
        noCompress "bin", "tflite", "litertlm", "task"
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    implementation "androidx.core:core-ktx:1.13.1"
    // "Hey VANI" wake word (Labs, default OFF) — on-device Vosk keyword
    // spotting, grammar-constrained. The ~36MB model is NOT bundled in the
    // APK; the Labs screen explains how to load it (docs/wake-word-eval.md).
    implementation "net.java.dev.jna:jna:5.13.0@aar"
    implementation "com.alphacephei:vosk-android:0.3.47@aar"
}
